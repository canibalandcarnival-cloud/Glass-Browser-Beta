name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Automatically creates a dummy debug keystore file at the root path expected by your project
      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # This removes the strict Firebase services requirement and ensures the fallback authentication objects exist
      - name: Strip Firebase and Inject Clean Stubs
        run: |
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts || true
          
          # Force create the directory path
          mkdir -p app/src/main/java/com/example/core
          mkdir -p app/src/main/java/com/example/ui/screens
          
          # Inject a fully compatible, type-safe mock class containing all UI variable dependencies
          cat << 'EOF' > app/src/main/java/com/example/core/GoogleAuthManager.kt
          package com.example.core
          
          import android.content.Context
          import android.content.Intent
          
          data class SignedInAccountSummary(
              val displayName: String = "Guest User",
              val email: String = "guest@example.com",
              val photoUrl: String? = null
          )
          
          fun Any?.toAccountSummary(): SignedInAccountSummary = SignedInAccountSummary()
          
          fun attemptAutoSignIn(onResult: (SignedInAccountSummary?) -> Unit) { onResult(SignedInAccountSummary()) }
          fun signInWithGoogleInteractive(launcher: Any? = null) { }
          fun signInWithGoogleInteractive(context: Context, onResult: (SignedInAccountSummary?) -> Unit) { onResult(SignedInAccountSummary()) }
          fun signOut(onComplete: () -> Unit) { onComplete() }
          
          class GoogleAuthManager(private val context: Context) {
              fun handleSignInResult(data: Intent?): Any? = null
              fun getSignInIntent(): Intent = Intent()
              fun signOut(onComplete: () -> Unit) { onComplete() }
              fun attemptAutoSignIn(onResult: (SignedInAccountSummary?) -> Unit) { onResult(SignedInAccountSummary()) }
              fun signInWithGoogleInteractive(launcher: Any? = null) { }
              fun signInWithGoogleInteractive(context: Context, onResult: (SignedInAccountSummary?) -> Unit) { onResult(SignedInAccountSummary()) }
          }
          EOF

          # Inject an empty block sheet layout container to clean up any missing file imports
          cat << 'EOF' > app/src/main/java/com/example/ui/screens/AccountAuthGlassSheet.kt
          package com.example.ui.screens
          import androidx.compose.runtime.Composable
          @Composable fun AccountAuthGlassSheet(onDismiss: () -> Unit) {}
          EOF

      # Configures memory limits cleanly via properties to safely bypass the KSP processing crash
      - name: Configure Build Memory Options
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "ksp.useKSP2=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

      # Executes compilation smoothly using the isolated memory configuration
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          arguments: assembleDebug -Djava.awt.headless=true
          build-root-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
