name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Automatically creates a dummy debug keystore file at the root path expected by your project
      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # This completely wipes the lines causing errors and swaps them for clean, dummy hardcoded data strings
      - name: Strip Firebase and Fix Selector Syntax
        run: |
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts || true
          sed -i 's/.*default_web_client_id.*/val defaultWebClientId = "dummy_id"/g' app/src/main/java/com/example/core/GoogleAuthManager.kt || true

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          arguments: assembleDebug
          build-root-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
