name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Automatically creates a dummy debug keystore file at the root path expected by your project
      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # This removes the Firebase plugin and builds a perfectly matching mock stub with all matching UI layout actions
      - name: Strip Firebase and Complete Mock Stub
        run: |
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts || true
          cat << 'EOF' > app/src/main/java/com/example/core/GoogleAuthManager.kt
          package com.example.core
          
          import android.content.Context
          import android.content.Intent
          
          data class SignedInAccountSummary(
              val displayName: String = "Guest User",
              val email: String = "guest@example.com",
              val photoUrl: String? = null
          )
          
          fun Any?.toAccountSummary(): SignedInAccountSummary = SignedInAccountSummary()
          
          class GoogleAuthManager(private val context: Context) {
              fun handleSignInResult(data: Intent?): Any? = null
              fun getSignInIntent(): Intent = Intent()
              fun signOut(onComplete: () -> Unit) { onComplete() }
              fun attemptAutoSignIn(onResult: (SignedInAccountSummary?) -> Unit) { onResult(null) }
              fun signInWithGoogleInteractive(launcher: Any? = null) { }
              fun signInWithGoogleInteractive(context: Context, onResult: (SignedInAccountSummary?) -> Unit) { onResult(null) }
          }
          EOF

      # Forces KSP to run in a safe, isolated cloud-friendly background worker process
      - name: Fix KSP Cloud Compiler Environment
        run: |
          echo "ksp.useKSP2=true" >> gradle.properties || true
          echo "ksp.incremental=false" >> gradle.properties || true

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          arguments: assembleDebug
          build-root-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
